# Hermetic test environment for the Oa4mpClient plugin.
#
# Stands up a real COmanage Registry (from the CILogon public image) plus a
# companion Postgres database, and overlays the plugin-under-test (this checkout)
# over the image's bundled released copy at app/Plugin/Oa4mpClient. Registry's
# own `Console/cake database` applies the overlaid plugin's schema.xml, so tests
# run against the pull request's code and table shape.
#
# See docs/plans/2026-08-19-0342-test-plugin-test-suite-plan.md (U1, U2).

services:
  comanage-registry-database:
    # Digest-pinned: nothing publishes a newer database image for these tests
    # to follow, so a pin keeps it from drifting. Override only deliberately,
    # e.g. when checking a newer image before bumping the pin here.
    image: ${OA4MP_TEST_DATABASE_IMAGE:-postgres@sha256:2fdfb9b432d4a73bd3eea3d989752c1e669b68d502347e0bfd2cc6d709f3d6b4}
    environment:
      POSTGRES_USER: registry_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry_user -d registry"]
      interval: 3s
      timeout: 5s
      retries: 20

  comanage-registry:
    # Follows the `latest` tag that CILogon's image build publishes to GHCR, so
    # a new build reaches both test tiers with no change here. The run scripts
    # pull it every run and report the digest that ran; compare that line
    # across runs to tell image drift from a code regression. Set
    # OA4MP_TEST_REGISTRY_IMAGE to run a specific image or digest instead.
    #
    # GHCR rather than public.ecr.aws: anonymous ECR Public pulls from Actions
    # runners failed intermittently with "toomanyrequests: Data limit
    # exceeded". See Test/README.md for the publishing contract and what to do
    # when a new image breaks the tests.
    image: ${OA4MP_TEST_REGISTRY_IMAGE:-ghcr.io/cilogon/comanage-registry:latest}
    depends_on:
      comanage-registry-database:
        condition: service_healthy
    environment:
      COMANAGE_REGISTRY_DATASOURCE: Database/Postgres
      COMANAGE_REGISTRY_DATABASE_HOST: comanage-registry-database
      COMANAGE_REGISTRY_DATABASE: registry
      COMANAGE_REGISTRY_DATABASE_USER: registry_user
      COMANAGE_REGISTRY_DATABASE_USER_PASSWORD: password
    volumes:
      # Overlay the plugin-under-test over the image's bundled released copy.
      - ../../:/srv/comanage-registry/app/Plugin/Oa4mpClient
    # Tests do not need the Apache web server; keep the container idle and drive
    # schema setup and the thin test runner via `docker compose exec`.
    entrypoint: ["sleep", "infinity"]
