# Hermetic tests: the merge gate for every pull request to registry-5.
#
# No public Registry 5 image exists, so the job builds Registry's own base
# image from CILogon's public Registry repository at the commit in
# workbench/registry.pin, the same image the workbench builds locally.

name: Hermetic tests

on:
  pull_request:
  push:
    branches:
      - registry-5

# No secrets are used by this workflow. Keep it that way.
permissions:
  contents: read

concurrency:
  group: hermetic-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: Test suites
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the plugin under test
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pinned Registry commit
        id: pin
        run: |
          sha="$(tr -d '[:space:]' < workbench/registry.pin)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workbench/registry.pin must hold one full commit id" >&2
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "label=wb-${sha:0:12}"
            echo "image=comanage-registry-base:wb-${sha:0:12}-1"
          } >> "$GITHUB_OUTPUT"

      - name: Check out Registry at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: cilogon/registry
          ref: ${{ steps.pin.outputs.sha }}
          path: registry-source
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Registry 5 image
        # Built exactly as workbench/bin/build-image builds the base image, so
        # the tag matches the one tests/run.sh looks for. The layer cache is
        # keyed on the pinned commit; a new pin builds from scratch once.
        uses: docker/build-push-action@v7
        with:
          context: registry-source
          file: registry-source/container/registry/base/Dockerfile
          build-args: |
            COMANAGE_REGISTRY_VERSION=${{ steps.pin.outputs.label }}
          labels: |
            org.opencontainers.image.revision=${{ steps.pin.outputs.sha }}
          tags: ${{ steps.pin.outputs.image }}
          load: true
          cache-from: type=gha,scope=registry-base-${{ steps.pin.outputs.sha }}
          cache-to: type=gha,mode=max,scope=registry-base-${{ steps.pin.outputs.sha }}

      - name: Run the style check and both suites
        env:
          OA4MP_TEST_REGISTRY_IMAGE: ${{ steps.pin.outputs.image }}
        run: tests/run.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          # gitleaks scans history, so a shallow clone would hide an earlier
          # commit that leaked a credential.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed credentials
        # The config is named explicitly rather than left to discovery, so a
        # scan that cannot read it fails loudly instead of silently falling
        # back to the default rules. See .gitleaks.toml for what it allows.
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            "$GITLEAKS_IMAGE" \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --no-banner
