# Live-server tier: exercises a real admin client on dev.cilogon.org.
#
# This workflow NEVER gates a pull request. It runs on a schedule or on demand,
# on main only, and is the only place the dev.cilogon.org test admin credential
# is in scope.
#
# The credential is bound at the platform level, not just by convention:
#   - it lives in the `live-server` GitHub Environment, whose deployment-branch
#     policy is restricted to main, so a workflow run on any other ref cannot
#     read it -- including a same-repo branch pull request that adds a workflow
#     to try, and a workflow_dispatch that selects another branch;
#   - the job additionally refuses to run unless github.ref is main;
#   - and it refuses to run outside the canonical repository, so no fork can
#     reach it.
# Triggers are limited to schedule and workflow_dispatch: never pull_request,
# never pull_request_target, and never workflow_run over pull-request head code,
# each of which would run a contributor's code with the secret in scope.
#
# See docs/plans/2026-08-19-0342-test-plugin-test-suite-plan.md U9 (R9-R13).

name: Live-server tests

on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Real clients are created on a shared server; never run two at once.
  group: live-server-tests
  cancel-in-progress: false

jobs:
  live-suite:
    name: Live-server suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Branch-restricted environment: the platform withholds the secret from any
    # run whose ref is outside the environment's deployment-branch policy.
    environment: live-server

    # Two refusals, both belt and braces behind the environment's own policy.
    #
    # The repository check keeps this tier off every fork. A fork's schedule
    # fires from the fork's own default branch, and a fork must never hold the
    # dev.cilogon.org credential -- so a scheduled run there can only fail. It
    # did: a fork went red at 07:00 UTC the first night after this workflow
    # reached main, and would have every night after. Skipping is the only
    # correct outcome on a fork, and skipping beats a workflow disabled by hand
    # in one fork's settings, which the next fork does not inherit.
    #
    # A fork owner who has their own test admin client can still run the tier
    # with Test/run-live.sh locally, which is where iterating on it belongs.
    #
    # The ref check refuses to run off main even if the environment's
    # deployment-branch policy is ever loosened.
    if: github.repository == 'cilogon/Oa4mpClient' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Run the live-server tier
        env:
          OA4MP_LIVE_SERVER_URL: ${{ secrets.OA4MP_LIVE_SERVER_URL }}
          OA4MP_LIVE_ADMIN_IDENTIFIER: ${{ secrets.OA4MP_LIVE_ADMIN_IDENTIFIER }}
          OA4MP_LIVE_ADMIN_SECRET: ${{ secrets.OA4MP_LIVE_ADMIN_SECRET }}
          OA4MP_LIVE_CO_ID: ${{ secrets.OA4MP_LIVE_CO_ID }}
        # Same digest-pinned environment as the hermetic tier: this job runs the
        # harness with a live credential in scope, so a mutable image alongside
        # a secret would be a supply-chain exfiltration risk.
        run: Test/run-live.sh
